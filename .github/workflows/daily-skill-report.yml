name: Daily AI Agent Project Report

on:
  push:
    branches:
      - main
    # 只监听生成器与页面模板，避免机器人写回 data/docs 后再次触发形成循环。
    paths:
      - ".github/workflows/daily-skill-report.yml"
      - "scripts/**"
      - "static/**"
      - "test/**"
      - "package.json"
  schedule:
    # GitHub cron 使用 UTC；01:45 UTC = 中国标准时间 09:45。
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "可选：补跑日期（YYYY-MM-DD）"
        required: false
        type: string
      reanalyze_project:
        description: "可选：重新分析历史项目（owner/repository）"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-agent-skill-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
      MAX_REPOSITORIES: ${{ vars.MAX_REPOSITORIES || '35' }}
      REPORT_TIMEZONE: Asia/Shanghai
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && 'on-demand' || 'daily' }}
      REANALYZE_PROJECT: ${{ inputs.reanalyze_project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Generate report and site
        run: |
          if [ -n "$REANALYZE_PROJECT" ]; then
            npm run reanalyze -- "$REANALYZE_PROJECT"
          elif [ "$REPORT_MODE" = "on-demand" ]; then
            npm run generate -- --additional
          else
            npm run generate
          fi

      - name: Commit generated data
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "docs: publish Agent Skill report"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
